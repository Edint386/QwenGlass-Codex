[project]
name = "glasscodex"
version = "0.1.0"
description = "View and drive Codex Desktop tasks from Qwen AI glasses"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
glasscodex = "glasscodex.cli:main"

[project.optional-dependencies]
mac = [
    "rumps>=0.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glasscodex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
